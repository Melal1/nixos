# Complete Noctalia settings for snowflake; edit this file independently.
[audio]
enable_overdrive = true

[backdrop]
tint_intensity = 0.6199999861419201

[bar.default]
background_opacity = 0.8099999818950891
font_family = "SF Pro Rounded"
font_weight = 700
margin_ends = 300
padding = 27
radius = 32
radius_top_left = 0
radius_top_right = 0
thickness = 38
widget_spacing = 9
start = [ "workspaces", "weather" ]
end = ["indicator", "audio_visualizer", "widget", "tray", "keyboard_layout"]

[bar.default.dead_zone.actions]
back = "annotate"
left = "none"
middle = "none"
right = "none"

[calendar]

[control_center]
show_session_button = false
show_shortcut_labels = false
sidebar_section = "none"

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = ["desktop-widget-0000000000000006"]

[desktop_widgets.grid]
cell_size = 24
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000006]
box_height = 168.0
box_width = 384.0
cx = 224.0
cy = 1344.0
output = "DP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "media_player"

[desktop_widgets.widget.desktop-widget-0000000000000006.settings]
album_art_background = true
audio_visualizer = true
background = true
background_opacity = 0.4
background_padding = 7
background_radius = 5
hide_when_no_media = true
layout = "horizontal"

[dock]
active_monitor_only = true
active_opacity = 0.5299999881535769
auto_hide = true
cross_axis_padding = 0
enabled = true
item_spacing = 14
magnification_scale = 1.6000000089406967
main_axis_padding = 27
radius = 43
radius_bottom_left = 0
radius_bottom_right = 0
reserve_space = false
show_dots = true
show_instance_count = false

[keybinds]
down = [ "Down", "Ctrl+j", "Ctrl+n" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+k", "Ctrl+p" ]

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[notification]
follow_focused_output = true
max_visible = 4

[osd]
follow_focused_output = true
offset_y = 0
position = "bottom_center"
position_vertical = "bottom_center"

[plugin_settings."thepunkoff/pomodoro"]
auto-start-breaks = true
long-break-duration = 45
short-break-duration = 25
work-duration = 45

[shell]
app_icon_color = "on_error"
avatar_path = "~/Pictures/Pfp/82eb36640687f3d80910be19ddf46758.jpg"
button_borders = false
clipboard_confirm_clear_history = false
font_family = "SF Pro Display"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
screen_time_enabled = true
show_close_buttons = false

[shell.animation]
speed = 0.850000012665987

[shell.launcher]
pinned = [ "com.obsproject.Studio" ]
width = 650

[shell.panel]
launcher_placement = "attached"

[shell.window_switcher]
show_all_outputs = false
show_app_icon = false
show_caption = false
show_count = false
style = "compact"

[system.monitor]
cpu_poll_seconds = 1
gpu_poll_seconds = 1
memory_poll_seconds = 1

# skwd-wall manages the desktop wallpaper.

[wallpaper]
enabled = false
fill_mode = "stretch"

[wallpaper.default]
path = "~/.local/state/theme/wallpaper"

[widget.audio_visualizer]
bands = 46
interactive = false
mirrored = false
scale = 0.9
show_when_idle = true
width = 181

[widget.cat]
capsule = false
capsule_opacity = 0.23
color = "primary"
executable_path = "evtest"
font_scale = 1.34
icon_color = "primary"
interactive = false
type = "noctalia/bongocat:cat"
input_devices = [ "/dev/input/by-id/usb-foostan_Corne_v4_vial:f64c2b3c-event-kbd" ]

[widget.clock]
font_scale = 1.18
font_weight = 700
format = "{: %l:%M %P}"
scale = 1.1500000000000001

[widget.keyboard_layout]
glyph = "keyboard-filled"

[widget.launcher]
enabled = false

[widget.tray]
drawer = true
drawer_columns = 4
drawer_item_size = 22.0

[widget.workspaces]
