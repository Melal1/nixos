# Host differences and hardware bindings; all other settings use the shared defaults.
[bar.default]
start = [ "cat", "workspaces", "weather" ]
end = [ "audio_visualizer", "widget", "tray", "keyboard_layout" ]

[bar.default.monitor.HDMI-A-1]
enabled = false

[lockscreen_widgets]
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
box_height = 196.0
box_width = 810.0
cx = 1280.0
cy = 1258.0
output = "DP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "HDMI-A-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugin_settings."noctalia/screen_recorder"]
frame_rate = 30
hide_inactive = true
replay_duration = 3600
replay_enabled = true

[plugins]
enabled = [ "noctalia/bongocat", "knyrps/nix-search", "thepunkoff/pomodoro", "noctalia/timer" ]

[wallpaper.last]
path = "~/.local/state/theme/wallpaper"

[wallpaper.monitors.DP-1]
path = "~/.local/state/theme/wallpaper"

[wallpaper.monitors.HDMI-A-1]
path = "~/.local/state/theme/wallpaper"

[widget.cat]
input_devices = [ "/dev/input/by-id/usb-foostan_Corne_v4_vial:f64c2b3c-event-kbd" ]
